<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الأدمين - التوصيل</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- رأس الصفحة والرصيد -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">📊 لوحة تحكم إدارة الطلبيات</h1>
        <p class="text-sm text-gray-500">متابعة الطلبات وتحديث حالات التوصيل</p>
      </div>
      <div class="bg-blue-50 border border-blue-200 px-6 py-3 rounded-xl text-center">
        <span class="text-xs text-blue-600 font-semibold block">إجمالي رصيد المحفظة</span>
        <span id="walletBalance" class="text-2xl font-bold text-blue-700">0.00 د.م</span>
      </div>
    </div>

    <!-- جدول الطلبيات -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-4 border-b border-gray-100 flex justify-between items-center">
        <h2 class="font-bold text-gray-700 text-lg">قائمة الطلبيات الحالية</h2>
        <button onclick="fetchOrders()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm px-4 py-2 rounded-lg transition">
          🔄 تحديث
        </button>
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-right border-collapse">
          <thead>
            <tr class="bg-gray-50 text-gray-600 text-xs uppercase border-b border-gray-100">
              <th class="p-3">#</th>
              <th class="p-3">الزبون</th>
              <th class="p-3">الهاتف</th>
              <th class="p-3">من</th>
              <th class="p-3">إلى</th>
              <th class="p-3">المبلغ</th>
              <th class="p-3">الحالة</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody" class="text-sm divide-y divide-gray-100 text-gray-700">
            <tr>
              <td colspan="7" class="text-center p-4 text-gray-400">جاري تحميل البيانات...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function fetchOrders() {
      try {
        const res = await fetch('/orders');
        const orders = await res.json();
        const tbody = document.getElementById('ordersTableBody');
        tbody.innerHTML = '';

        if (!orders || orders.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4 text-gray-400">لا توجد طلبيات مسجلة حالياً.</td></tr>';
          return;
        }

        let total = 0;
        orders.forEach((o, index) => {
          total += parseFloat(o.price || 0);
          const tr = document.createElement('tr');
          tr.className = "hover:bg-gray-50 transition";
          tr.innerHTML = `
            <td class="p-3 font-semibold">${index + 1}</td>
            <td class="p-3">${o.customer_name || '-'}</td>
            <td class="p-3">${o.customer_phone || '-'}</td>
            <td class="p-3 text-xs text-gray-500">${o.pickup_address || '-'}</td>
            <td class="p-3 text-xs text-gray-500">${o.delivery_address || '-'}</td>
            <td class="p-3 font-bold text-gray-800">${o.price} د.م</td>
            <td class="p-3">
              <span class="px-2 py-1 text-xs rounded-full bg-yellow-100 text-yellow-800">
                ${o.status || 'قيد الانتظار'}
              </span>
            </td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById('walletBalance').innerText = total.toFixed(2) + ' د.م';
      } catch (err) {
        console.error(err);
      }
    }

    // تحميل البيانات أول ما تفتح الصفحة
    fetchOrders();
  </script>
</body>
</html>
